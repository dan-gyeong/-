<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자기소개서 도우미</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2430; --muted:#667085; --line:#d9dde3; --accent:#2563eb; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d222a; --text:#e6e9ee; --muted:#9aa4b2; --line:#333a45; --accent:#6b9bff; --warn:#f0b35a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:13px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; cursor:pointer; font-size:15px; }
  .tabs button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; margin:10px 0 4px; font-size:13px; }
  input, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:150px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 160px; gap:10px; }
  @media (max-width:560px){ .row { grid-template-columns:1fr; } }
  .count { color:var(--muted); font-size:12px; text-align:right; }
  .go { margin-top:12px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:wait; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-word; font:inherit; margin:0; }
  .out h3 { margin:0 0 8px; font-size:15px; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  .over { color:var(--warn); font-weight:600; }
  ul { margin:6px 0; padding-left:20px; }
  .issue { border-left:3px solid var(--accent); padding:4px 10px; margin:8px 0; }
  .issue q { color:var(--muted); display:block; font-size:13px; }
  .err { color:#dc2626; }
  .copy { margin-top:8px; padding:5px 10px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:6px; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>자기소개서 도우미</h1>
  <p class="sub">경험 메모로 초안을 만들고, 작성한 글을 첨삭합니다. 이름·연락처·주소 등 개인정보는 입력하지 마세요.</p>

  <div class="tabs">
    <button id="tabDraft" class="on" type="button">초안 작성</button>
    <button id="tabReview" type="button">첨삭</button>
  </div>

  <div class="card">
    <div class="row">
      <div><label for="job">지원 분야/직무</label><input id="job" placeholder="예: 사무행정, 시설관리 (기관명은 생략 가능)"></div>
      <div><label for="limit">글자수 제한(공백 포함)</label><input id="limit" type="number" min="0" placeholder="예: 1000"></div>
    </div>
    <label for="question">문항</label>
    <input id="question" placeholder="예: 지원동기와 직무 관련 경험을 기술하시오">

    <div id="draftBox">
      <label for="memo">경험 메모 (상황·역할·행동·결과를 자유롭게)</label>
      <textarea id="memo" placeholder="예: 2019~2022 복지관 행정 담당. 월 200건 서류 처리 중 누락이 잦아 체크리스트를 만들어 운영함. 누락 건수는 [직접 확인한 수치]로 감소..."></textarea>
      <div class="count"><span id="memoN">0</span>자</div>
      <button id="goDraft" class="go" type="button">초안 작성</button>
    </div>

    <div id="reviewBox" hidden>
      <label for="text">첨삭할 글</label>
      <textarea id="text" placeholder="작성한 자기소개서를 붙여넣으세요."></textarea>
      <div class="count"><span id="textN">0</span>자 (공백 제외 <span id="textNS">0</span>자)</div>
      <button id="goReview" class="go" type="button">첨삭 받기</button>
    </div>
    <p class="hint">AI는 입력한 사실만 사용하며, 부족한 정보는 [확인 필요]로 표시합니다. 결과는 반드시 본인이 사실 여부를 확인한 뒤 사용하세요.</p>
  </div>

  <div id="out" class="card out" hidden></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let mode = "draft";

function setMode(m) {
  mode = m;
  $("tabDraft").classList.toggle("on", m === "draft");
  $("tabReview").classList.toggle("on", m === "review");
  $("draftBox").hidden = m !== "draft";
  $("reviewBox").hidden = m !== "review";
  $("out").hidden = true;
}
$("tabDraft").onclick = () => setMode("draft");
$("tabReview").onclick = () => setMode("review");
$("memo").oninput = () => $("memoN").textContent = $("memo").value.length;
$("text").oninput = () => {
  const v = $("text").value;
  $("textN").textContent = v.length;
  $("textNS").textContent = v.replace(/\s/g, "").length;
};

function lengthLine(n, ns) {
  const lim = parseInt($("limit").value, 10);
  const over = lim && n > lim;
  return `<div class="meta ${over ? "over" : ""}">${n}자 (공백 제외 ${ns}자)${lim ? ` / 제한 ${lim}자${over ? " 초과" : ""}` : ""}</div>`;
}

function copyBtn(id) { return `<button class="copy" type="button" data-copy="${id}">복사</button>`; }

function show(html) {
  const out = $("out");
  out.innerHTML = html;
  out.hidden = false;
  out.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText($(b.dataset.copy).textContent);
    b.textContent = "복사됨";
  });
  out.scrollIntoView({ behavior: "smooth" });
}

async function call(path, body, btn) {
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = "처리 중...";
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "요청 실패");
    return data;
  } catch (e) {
    show(`<p class="err">${esc(e.message)}</p>`);
    return null;
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

const base = () => ({ job: $("job").value, question: $("question").value, limit: $("limit").value });

$("goDraft").onclick = async function () {
  const d = await call("/api/draft", { ...base(), memo: $("memo").value }, this);
  if (!d) return;
  if (d.raw) return show(`<h3>결과</h3><pre id="r">${esc(d.raw)}</pre>${copyBtn("r")}`);
  const missing = (d.missing || []).map(m => `<li>${esc(m)}</li>`).join("");
  show(`<h3>초안</h3><pre id="r">${esc(d.draft)}</pre>${lengthLine(d.length, d.length_no_space)}${copyBtn("r")}
        ${missing ? `<h3 style="margin-top:14px">보완하면 좋을 정보</h3><ul>${missing}</ul>` : ""}`);
};

$("goReview").onclick = async function () {
  const d = await call("/api/review", { ...base(), text: $("text").value }, this);
  if (!d) return;
  if (d.raw) return show(`<h3>결과</h3><pre id="r">${esc(d.raw)}</pre>${copyBtn("r")}`);
  const list = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  const issues = (d.issues || []).map(i =>
    `<div class="issue"><q>“${esc(i.quote)}”</q><b>${esc(i.problem)}</b><br>→ ${esc(i.suggestion)}</div>`).join("");
  show(`<h3>총평</h3><p>${esc(d.summary)}</p>
        <h3>잘된 점</h3><ul>${list(d.strengths)}</ul>
        <h3>개선할 점</h3>${issues}
        <h3 style="margin-top:14px">첨삭본</h3><pre id="r">${esc(d.revised)}</pre>
        ${lengthLine(d.length, d.length_no_space)}${copyBtn("r")}`);
};
</script>
</body>
</html>
