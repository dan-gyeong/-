<style>
  :root{

    --accent:#1B6E62;
    --accent-dark:#124A42;
    --accent-tint:#E4F0EC;
    --ok:#2F6B33;
    --ok-bg:#E4F1E0;
    --danger:#AE3A22;
    --danger-bg:#FBE7E0;
    --focus:#1B6E62;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171613;
      --surface:#211F1B;
      --surface-2:#2A2723;
      --text:#EFEAE1;
      --muted:#A9A192;
      --border:#3A362F;
      --accent:#4FBBA8;
      --accent-dark:#7ED4C4;
      --accent-tint:#1D302C;
      --ok:#8FCB8A;
      --ok-bg:#213524;
      --danger:#E68366;
      --danger-bg:#3A241C;
      --focus:#4FBBA8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171613;
    --surface:#211F1B;
    --surface-2:#2A2723;
    --text:#EFEAE1;
    --muted:#A9A192;
    --border:#3A362F;
    --accent:#4FBBA8;
    --accent-dark:#7ED4C4;
    --accent-tint:#1D302C;
    --ok:#8FCB8A;
    --ok-bg:#213524;
    --danger:#E68366;
    --danger-bg:#3A241C;
    --focus:#4FBBA8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:"Gothic A1","Malgun Gothic",sans-serif; margin:0; text-wrap:balance;}
  button, input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--accent-dark);
    color:#fff;
    padding:14px 16px 16px;
  }
  .topbar .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:#CFEAE3; margin-bottom:2px;
  }
  .topbar h1{font-size:19px; font-weight:800; color:#fff; margin-bottom:2px;}
  .topbar .sub{font-size:13px; color:#CFEAE3; margin-bottom:12px;}

  .search-wrap{position:relative;}
  .search-wrap input{
    width:100%; padding:14px 44px 14px 16px; border-radius:14px; border:none;
    font-size:17px; background:#fff; color:var(--text);
  }
  .search-wrap input::placeholder{color:var(--muted);}
  .search-icon{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    color:var(--muted); pointer-events:none; font-size:18px;
  }

  .family-scroll{
    display:flex; gap:8px; overflow-x:auto; padding:12px 16px 0; margin:0 -16px 0;
    scrollbar-width:none;
  }
  .family-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1.5px solid #3C7F74;
    background:#1B6E62; color:#fff; font-size:14px; font-weight:600; white-space:nowrap;
  }
  .chip.active{background:#fff; color:var(--accent-dark); border-color:#fff;}

  main{max-width:640px; margin:0 auto; padding:14px 16px 48px;}

  .status-line{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--muted); margin:2px 4px 12px;
  }
  .status-line strong{color:var(--text); font-variant-numeric:tabular-nums;}

  .disclaimer{
    background:var(--accent-tint); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:13px; color:var(--muted); margin-bottom:14px;
  }

  .program{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    margin-bottom:14px; overflow:hidden;

  .program summary{

  }
  .program summary::-webkit-details-marker{display:none;}
  .program summary .arrow{color:var(--muted); font-size:13px; transition:transform .15s ease;}
  .program[open] summary .arrow{transform:rotate(180deg);}
  .program-body{padding:0 14px 14px;}
  .floor-group{margin-top:12px;}
  .floor-group:first-child{margin-top:0;}
  .floor-label{
    font-family:"Gothic A1",sans-serif; font-weight:800; font-size:13px;

  .prog-row{padding:8px 0; border-top:1px solid var(--border);}

  .prog-time{

  }
  .prog-desc{font-size:13.5px; color:var(--muted); margin-top:3px; white-space:pre-line;}
  .prog-row.highlight .prog-desc{color:var(--text);}

  .card-list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 14px; cursor:pointer;
  }
  .card-head{display:flex; align-items:flex-start; gap:12px;}
  .booth{

    font-size:15px; line-height:1.15; font-variant-numeric:tabular-nums;
  }
  .booth small{display:block; font-size:10px; font-weight:600; opacity:.85; letter-spacing:.03em;}
  .card-main{flex:1 1 auto; min-width:0;}
  .company{font-weight:700; font-size:15.5px; color:var(--text);}
  .jobtitle{font-family:"Gothic A1",sans-serif; font-weight:800; font-size:17.5px; margin-top:2px; color:var(--accent-dark);}
  .meta-row{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:8px; font-size:13px; color:var(--muted);}
  .meta-row span{white-space:nowrap;}
  .badge{
    display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700;
  }
  .badge.ok{background:var(--ok-bg); color:var(--ok);}
  .badge.closed{background:var(--danger-bg); color:var(--danger);}
  .chevron{flex:0 0 auto; color:var(--muted); font-size:14px; margin-top:6px; transition:transform .15s ease;}
  .card.open .chevron{transform:rotate(180deg);}

  .detail{
    display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);
    font-size:14.5px;
  }
  .card.open .detail{display:block;}
  .detail dl{display:grid; grid-template-columns:88px 1fr; gap:7px 10px; margin:0;}
  .detail dt{color:var(--muted); font-weight:600;}
  .detail dd{margin:0; color:var(--text);}
  .detail .note{
    margin-top:10px; padding:9px 10px; background:var(--surface-2); border-radius:8px;
    font-size:13.5px; color:var(--muted);
  }

  .empty{
    text-align:center; padding:48px 20px; color:var(--muted);
  }
  .empty .big{font-size:32px; margin-bottom:8px;}

  footer{

  }

  @media (prefers-reduced-motion: reduce){
    * {transition:none !important;}
  }

const FAMILY_LABEL = {'조리·돌봄·시설관리':'조리·돌봄·시설관리', '사무·행정·운영지원':'사무·행정·운영지원',
  '교육·서비스·영업':'교육·서비스·영업', '운송·물류·제조':'운송·물류·제조'};

let activeFamily = '';

function renderFamilyChips(){
  const wrap = document.getElementById('familyScroll');
  const families = ['전체', ...Object.keys(FAMILY_LABEL)];
  wrap.innerHTML = families.map(f=>{
    const label = f === '전체' ? '전체' : FAMILY_LABEL[f];
    const val = f === '전체' ? '' : f;
    const active = activeFamily === val ? 'active' : '';
    return `<button type="button" class="chip ${active}" data-fam="${val}">${label}</button>`;
  }).join('');
  wrap.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeFamily = btn.dataset.fam;
      renderFamilyChips();
      render();
    });
  });
}

function esc(s){
  return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function cardHTML(job){
  const closed = job.status === '당일마감';
  const badge = closed ? '<span class="badge closed">당일마감</span>' : '<span class="badge ok">모집중</span>';
  return `
  <div class="card" data-id="${job.job_id}">
    <div class="card-head">
      ${job.booth_no ? `<div class="booth">${esc(job.booth_no)}</div>` : ''}
      <div class="card-main">
        <div class="company">${esc(job.company) || '정보없음'}</div>
        <div class="jobtitle">${esc(job.job_title) || '정보없음'}</div>
        <div class="meta-row">
          <span>${esc(job.work_area) || '정보없음'}</span>
          <span>·</span>
          <span>${esc(job.pay_text) || '정보없음'}</span>
          <span>${badge}</span>
        </div>
      </div>
      <div class="chevron">▾</div>
    </div>
    <div class="detail">
      <dl>
        <dt>위치</dt><dd>${job.booth_no ? esc(job.booth_no)+'번 부스' : '정보없음'}</dd>
        <dt>업종</dt><dd>${esc(job.industry) || '정보없음'}</dd>
        <dt>모집구분</dt><dd>${esc(job.recruit_type) || '정보없음'}</dd>
        <dt>직무군</dt><dd>${FAMILY_LABEL[job.job_family] || '정보없음'}</dd>
        <dt>채용인원</dt><dd>${esc(job.headcount) || '정보없음'}</dd>
        <dt>근무형태</dt><dd>${esc(job.employment_type) || '정보없음'}</dd>
        <dt>근무시간</dt><dd>${esc(job.work_schedule) || '정보없음'}</dd>
        <dt>근무조건</dt><dd>${esc(job.work_condition) || '정보없음'}</dd>
        ${job.job_description ? `<dt>직무내용</dt><dd>${esc(job.job_description)}</dd>` : ''}
        <dt>필요학력</dt><dd>${esc(job.education) || '정보없음'}</dd>
        <dt>필수자격</dt><dd>${esc(job.required_license) || '정보없음'}</dd>
        <dt>우대자격</dt><dd>${esc(job.preferred_license) || '정보없음'}</dd>
        <dt>필요경력</dt><dd>${esc(job.experience_note) || '정보없음'}</dd>
        ${job.qualification_note ? `<dt>자격요건</dt><dd>${esc(job.qualification_note)}</dd>` : ''}
        ${job.preference_note ? `<dt>우대사항</dt><dd>${esc(job.preference_note)}</dd>` : ''}
        <dt>정년/연령</dt><dd>${esc(job.age_note) || '정보없음'}</dd>
        <dt>성별제한</dt><dd>${esc(job.gender_note) || '정보없음'}</dd>
        ${job.homepage ? `<dt>홈페이지</dt><dd>${esc(job.homepage)}</dd>` : ''}
      </dl>
      ${job.etc_note ? `<div class="note">${esc(job.etc_note)}</div>` : ''}
    </div>
  </div>`;
}

let openId = null;

function render(){
  const q = document.getElementById('q').value.trim();
  let matches = JOBS.filter(j => !activeFamily || j.job_family === activeFamily);
  if(q){
    matches = matches.filter(j => (j.company||'').includes(q) || (j.job_title||'').includes(q));
  }
  document.getElementById('count').textContent = matches.length;
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if(matches.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = matches.map(cardHTML).join('');
  if(openId){
    const el = list.querySelector(`[data-id="${CSS.escape(openId)}"]`);
    if(el) el.classList.add('open');
  }
  list.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const id = card.dataset.id;
      const wasOpen = card.classList.contains('open');
      list.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));
      if(!wasOpen){ card.classList.add('open'); openId = id; }
      else { openId = null; }
    });
  });
}

document.getElementById('q').addEventListener('input', render);
renderFamilyChips();
render();
</script>
